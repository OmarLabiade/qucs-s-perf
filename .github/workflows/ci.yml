name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  microbench:
    name: C++ build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -G Ninja -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test
        run: python -m pytest -q

  hooks-patch:
    name: Timing hooks apply to the pinned Qucs-S commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Qucs-S at the pinned commit
        run: |
          commit="$(cat instrumentation/UPSTREAM_COMMIT)"
          git init -q qucs_s
          git -C qucs_s remote add origin https://github.com/ra3xdh/qucs_s.git
          git -C qucs_s fetch -q --depth 1 origin "$commit"
          git -C qucs_s checkout -q --detach FETCH_HEAD
      - name: Check the patch
        run: git -C qucs_s apply --check --verbose "$PWD/instrumentation/perf-bench-hooks.patch"
